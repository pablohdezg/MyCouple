name: Publicar web (para actualizar la app sin APK nuevo)

# Publica la app web en GitHub Pages en cada cambio. Es la mitad "servidor"
# del sistema de actualización sin recompilar: ver las notas en
# capacitor.config.ts para activarlo en la app.
#
# Antes de que esto funcione, hazlo UNA vez:
#   Settings del repositorio → Pages → "Source" → elige "GitHub Actions".

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web (con la ruta base de GitHub Pages)
        run: npx vite build --base=/${{ github.event.repository.name }}/

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir el resultado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
