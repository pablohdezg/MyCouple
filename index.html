<!doctype html>
<html lang="es" data-palette="rubor" data-dark="0">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fff6f4" />
    <meta name="description" content="Vuestro rincón privado: recuerdos, planes, preguntas y juegos para dos." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyCouple" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MyCouple</title>
    <style>
      /* Pantalla de carga: evita el parpadeo blanco al abrir */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff6f4;
        z-index: 999;
        transition: opacity 0.4s ease;
        font-size: 54px;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes bootbeat {
        0%, 100% { transform: scale(1); }
        20% { transform: scale(1.16); }
        40% { transform: scale(1); }
      }
      #boot span { animation: bootbeat 1.4s ease-in-out infinite; }
    </style>
  </head>
  <body>
    <div id="boot"><span>💞</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        const boot = document.getElementById('boot')
        if (boot) {
          boot.classList.add('gone')
          setTimeout(() => boot.remove(), 500)
        }
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        }
      })
    </script>
  </body>
</html>
